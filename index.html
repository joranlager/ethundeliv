<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Et hundeliv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ef; --ink:#4a3428; --soft:#8a6d5c; --accent:#ff8a5c; --accent2:#ffb35c;
  --card:rgba(255,250,244,.92); --line:rgba(120,80,50,.15); --good:#5cc27a; --warn:#ffb33c; --bad:#ff5c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e7d8;font-family:Fredoka,"Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

#topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
#topbar > *{pointer-events:auto}
.logo{font-weight:700;font-size:26px;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,#ff9a6a,#ff6f91);padding:6px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(255,110,120,.35)}
.pill{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;box-shadow:0 3px 10px rgba(80,40,20,.12);backdrop-filter:blur(6px)}
#lvl b{color:var(--accent)}
.spacer{flex:1}
.iconbtn{background:var(--card);width:42px;height:42px;border-radius:50%;font-size:20px;box-shadow:0 3px 10px rgba(80,40,20,.12)}
.iconbtn:hover{transform:scale(1.06)}

#stats{position:fixed;top:70px;right:12px;width:270px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 6px 24px rgba(80,40,20,.16);z-index:5;backdrop-filter:blur(8px)}
#stats h3{margin:0 0 2px;font-size:20px}
#stats .sub{font-size:13px;color:var(--soft);margin-bottom:10px;line-height:1.35}
.stat{margin:7px 0}
.stat .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.bar{height:11px;background:rgba(120,80,50,.12);border-radius:99px;overflow:hidden;margin-top:3px}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .3s,background .3s}
.mood{margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,180,120,.18);font-size:14px;line-height:1.35}
.mood.bad{background:rgba(255,90,90,.18)}
#plageRow{display:none}
#plageRow.on{display:block}
#plageRow .lbl{color:#d23c3c}

#actions{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;max-width:calc(100% - 20px);overflow-x:auto;padding:6px;scrollbar-width:none}
.act{background:var(--card);border-radius:18px;min-width:74px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 14px rgba(80,40,20,.15);font-weight:600;font-size:13px;transition:transform .12s, opacity .2s}
.act span{font-size:26px;line-height:1.1}
.act:hover:not(:disabled){transform:translateY(-3px)}
.act:disabled{opacity:.45;cursor:default}
.act.gold{background:linear-gradient(135deg,#ffe48a,#ffb84d)}

#toolbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border-radius:22px;padding:12px 18px;box-shadow:0 6px 24px rgba(80,40,20,.18);z-index:6;display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px)}
#toolbar .hint{font-size:15px;max-width:330px}
#toolbar .bar{width:150px;height:14px}
.btn{background:linear-gradient(135deg,#ff9a6a,#ff6f91);color:#fff;font-weight:600;font-size:16px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 12px rgba(255,110,120,.35)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(80,40,20,.15)}
.btn:hover{filter:brightness(1.05)}

#bubble{position:fixed;z-index:4;pointer-events:none;background:#fff;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 14px rgba(80,40,20,.2);transform:translate(-50%,-100%);transition:opacity .3s}
#bubble::after{content:"";position:absolute;bottom:-8px;left:10px;width:14px;height:14px;background:#fff;border-radius:50%}
#bubble::before{content:"";position:absolute;bottom:-17px;left:2px;width:8px;height:8px;background:#fff;border-radius:50%}

#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none}
.toast{background:var(--card);padding:9px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(80,40,20,.18);font-weight:500;animation:tin .3s ease-out}
.toast.bad{background:#ffe1dc;color:#a42a2a}
.toast.good{background:#e2f7e6;color:#256b3a}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}

#modal{position:fixed;inset:0;background:rgba(70,40,25,.35);display:flex;align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(3px);padding:14px}
#modalCard{background:#fffaf4;border-radius:26px;padding:24px 26px;max-width:820px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(60,30,10,.3)}
#modalCard h2{margin:0 0 6px;font-size:28px}
#modalCard p{line-height:1.5;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.breed{background:#fff;border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 10px rgba(80,40,20,.1);transition:transform .12s;border:2px solid transparent}
.breed:hover{transform:translateY(-3px);border-color:var(--accent2)}
.breed .sw{display:flex;gap:4px;margin-bottom:6px}
.breed .sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.breed b{display:block;font-size:16px}
.breed small{color:var(--soft);font-size:12.5px;line-height:1.3;display:block;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
input.name{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);outline:none;min-width:220px}
input.name:focus{border-color:var(--accent2)}
.cloth{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 10px rgba(80,40,20,.1);border:2px solid transparent}
.cloth.on{border-color:var(--good)}
.cloth.locked{opacity:.5}
.cloth .top{display:flex;align-items:center;gap:8px;font-weight:600}
.cloth .top span{font-size:26px}
.cloth .sws{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cloth .sws button{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cloth .sws button.sel{outline:3px solid var(--accent);outline-offset:1px}
.cloth .tog{margin-top:8px;font-size:13px;padding:5px 10px;border-radius:99px;background:#f3ebe3}
.cloth.on .tog{background:#ffe1dc}

#litterLabels > div,.tag{position:fixed;transform:translate(-50%,0);z-index:4;text-align:center;pointer-events:auto}
.lcard{background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:0 4px 14px rgba(80,40,20,.16);min-width:150px}
.lcard b{font-size:17px}
.lcard small{display:block;color:var(--soft);font-size:12.5px;margin:2px 0 6px;line-height:1.3}
#litterTop{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:5;text-align:center}

#showUI{position:fixed;inset:0;z-index:8;pointer-events:none}
#showTitle{position:absolute;top:140px;left:50%;transform:translateX(-50%);text-align:center}
#showTitle h2{margin:0;font-size:30px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.45)}
#showTitle div{color:#ffe7b8;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#showCards{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;width:min(960px,calc(100% - 20px))}
.scard{flex:1;background:rgba(255,250,244,.94);border-radius:18px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .3s, box-shadow .3s;min-width:0}
.scard.me{box-shadow:0 0 0 3px var(--accent2),0 6px 20px rgba(0,0,0,.25)}
.scard.active{transform:translateY(-8px)}
.scard b{font-size:16px}
.scard small{display:block;color:var(--soft);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.judges{display:flex;gap:6px;margin-top:6px}
.judges i{flex:1;font-style:normal;text-align:center;background:#f3ebe3;border-radius:10px;padding:4px 0;font-weight:600;font-size:17px;transition:background .3s}
.judges i.in{background:#ffe9b8;animation:pop .35s}
.total{margin-top:6px;font-weight:700;font-size:18px;display:flex;justify-content:space-between}
.medal{font-size:24px}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#showResult{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;background:#fffaf4;border-radius:24px;padding:20px 26px;max-width:460px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#showResult h2{margin:0 0 6px}
#showResult .comments{text-align:left;font-size:14.5px;background:#f6eee6;border-radius:12px;padding:8px 12px;margin:10px 0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#f6e7d8;z-index:50;font-size:22px;gap:10px}
#loading .paw{font-size:50px;animation:bob 1s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (max-width:640px){
  .logo{font-size:19px;padding:5px 12px}
  #stats{top:auto;bottom:110px;right:8px;left:8px;width:auto}
  .act{min-width:62px;font-size:12px}
  .act span{font-size:22px}
  #dogname{display:none}
}
</style>

</script>

<body>
<canvas id="c"></canvas>

<div id="topbar">
  <div class="logo">🐾 Et hundeliv</div>
  <div class="pill" id="lvl">Nivå <b>1</b> · Valpepasser</div>
  <div class="pill" id="dogname"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnHelp" title="Hvordan spiller man?">❓</button>
  <button class="iconbtn" id="btnStats" title="Vis/skjul stats">📊</button>
</div>

<div id="stats" class="hidden">
  <h3 id="sName">–</h3>
  <div class="sub" id="sSub"></div>
  <div class="stat"><div class="lbl"><span>🍖 Metthet</span><span id="vFood"></span></div><div class="bar"><i id="bFood"></i></div></div>
  <div class="stat"><div class="lbl"><span>🛁 Renhet</span><span id="vClean"></span></div><div class="bar"><i id="bClean"></i></div></div>
  <div class="stat"><div class="lbl"><span>😊 Glede</span><span id="vHappy"></span></div><div class="bar"><i id="bHappy"></i></div></div>
  <div class="stat"><div class="lbl"><span>⚡ Energi</span><span id="vEnergy"></span></div><div class="bar"><i id="bEnergy"></i></div></div>
  <div class="stat"><div class="lbl"><span>✨ Pels</span><span id="vGroom"></span></div><div class="bar"><i id="bGroom"></i></div></div>
  <div class="stat"><div class="lbl"><span>💖 Trivsel</span><span id="vWell"></span></div><div class="bar"><i id="bWell"></i></div></div>

  <div class="mood" id="sMood"></div>
</div>

<div id="actions" class="hidden">
  <button class="act" data-a="feed"><span>🍖</span>Mat</button>
  <button class="act" data-a="wash"><span>🛁</span>Vask</button>
  <button class="act" data-a="brush"><span>✨</span>Børst</button>
  <button class="act" data-a="play"><span>🎾</span>Lek</button>
  <button class="act" data-a="pet"><span>💕</span>Kos</button>
  <button class="act" data-a="sleep" id="btnSleep"><span>💤</span>Sov</button>
  <button class="act" data-a="clothes"><span>👕</span>Klær</button>
  <button class="act gold" data-a="show"><span>🏆</span>Utstilling</button>
</div>

<div id="toolbar" class="hidden">
  <div class="hint" id="toolHint"></div>
  <div><div class="bar"><i id="toolBar"></i></div></div>
  <button class="btn" id="toolDone">Ferdig</button>
</div>

<div id="bubble" class="hidden"></div>
<div id="toasts"></div>
<div id="litterLabels"></div>
<div id="litterTop" class="hidden"></div>
<div id="showUI" class="hidden"><div id="showTitle"></div><div id="showCards"></div><div id="showResult" class="hidden"></div></div>
<div id="modal" class="hidden"><div id="modalCard"></div></div>
<div id="loading"><div class="paw">🐾</div>Et hundeliv laster…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   Hjelpefunksjoner
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=id=>document.getElementById(id);
function dampAngle(a,b,l,dt){let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*(1-Math.exp(-l*dt));}
function jitter(hex,r,h=.02,s=.08,l=.07){const c=new THREE.Color(hex),o={};c.getHSL(o);c.setHSL((o.h+(r()-.5)*h+1)%1,clamp(o.s+(r()-.5)*s,0,1),clamp(o.l+(r()-.5)*l,0,1));return '#'+c.getHexString();}
function shade(hex,dl){const c=new THREE.Color(hex),o={};c.getHSL(o);c.setHSL(o.h,o.s,clamp(o.l+dl,0,1));return '#'+c.getHexString();}
function lightness(hex){const o={};new THREE.Color(hex).getHSL(o);return o.l;}

/* =========================================================
   Data: raser, navn, egenskaper, klær, nivåer
   ========================================================= */
const NAMES=['Bamse','Luna','Milo','Bella','Leo','Molly','Charlie','Nala','Rocky','Frøya','Buster','Lilly','Max','Tassen','Pelle','Kira','Odin','Saga','Loke','Tyra','Fido','Snuppa','Klumpen','Pjokken','Trulte','Nuppi','Diva','Brutus','Muffins','Kanel','Kakao','Lakris','Sukker','Toffee','Bjørnis','Ronja','Emil','Pippi','Rufus','Sokke','Tufsa','Vaffel','Pølse','Kosen','Bolle','Tutti','Lykke','Flekken','Pus','Kompis'];
const TRAITS=[
  {id:'leken',name:'Leken',desc:'elsker å leke – blir fort lei seg uten lek',m:{happy:1.25,play:1.4}},
  {id:'matglad',name:'Matglad',desc:'blir fort sulten',m:{food:1.3}},
  {id:'kosete',name:'Kosete',desc:'blir ekstra glad av kos',m:{pet:1.8}},
  {id:'rolig',name:'Rolig',desc:'har god tålmodighet',m:{energy:.8,happy:.85}},
  {id:'vann',name:'Badeglad',desc:'elsker å bli vasket',m:{bath:1}},
  {id:'sovnig',name:'Søvnig',desc:'trenger mye søvn',m:{energy:1.35}},
  {id:'soler',name:'Sølete',desc:'blir fort skitten',m:{clean:1.3}},
  {id:'pen',name:'Forfengelig',desc:'liker å være fin – pelsen trenger stell',m:{groom:1.3,outfit:1.15}},
];
const LEVELS=['','Valpepasser','Hundevenn','Hundeeier','Hundetrener','Oppdretter','Utstiller','Dommerfavoritt','Mester','Stormester','Champion'];
const CLOTHES=[
  {id:'collar',name:'Halsbånd',emoji:'📿',lvl:1,slot:'neck1'},
  {id:'bow',name:'Rosett',emoji:'🎀',lvl:1,slot:'bow'},
  {id:'scarf',name:'Skjerf',emoji:'🧣',lvl:1,slot:'neck2'},
  {id:'beanie',name:'Lue',emoji:'🧶',lvl:2,slot:'head'},
  {id:'sweater',name:'Genser',emoji:'🧥',lvl:2,slot:'body'},
  {id:'glasses',name:'Solbriller',emoji:'🕶️',lvl:3,slot:'eyes'},
  {id:'party',name:'Festhatt',emoji:'🥳',lvl:4,slot:'head'},
  {id:'crown',name:'Krone',emoji:'👑',lvl:6,slot:'head'},
];
const COLORS=['#e84c4c','#ff8fb1','#ffb84d','#f5d742','#4cc27a','#4a9ae8','#9b6ae0','#ffffff','#2b2b2b'];

const PART_KEYS=['body','chest','neck','head','snout','ear','leg','paw','tail','tailTip'];
function mk(r,dims,col){
  const d={size:1,bodyW:.34,bodyH:.3,bodyL:.5,legLen:.28,legR:.095,headR:.42,snoutL:.2,snoutW:.18,snoutH:.14,furLen:.06,density:110,curl:0,
    earType:'floppy',earSize:1,earTilt:.25,earRound:0,earFlip:0,tailType:'normal',tailLen:.36,tailR:.065,eye:'#2a170c',nose:'#1a1412',eyeSize:1,low:null,spot:null,tailTip:false};
  const L={...d,...dims};
  const v=(x,a)=>x*(1+(r()-.5)*2*a);
  for(const k of ['bodyW','bodyH','bodyL','legLen','snoutL','tailLen']) L[k]=v(L[k],.06);
  L.headR=v(L.headR,.05); L.earSize=v(L.earSize,.08); L.eyeSize=v(L.eyeSize,.08); L.size=v(L.size,.06); L.furLen=v(L.furLen,.15);
  L.c={};
  for(const k of PART_KEYS) L.c[k]={a:col.all};
  if(col.paw===undefined && col.leg) L.c.paw={...col.leg};
  for(const k in col) if(k!=='all') L.c[k]={a:col.all,...col[k]};
  if(!col.paw && col.leg) L.c.paw={...L.c.leg};
  L.eyeL=L.eyeR=L.eye;
  L.features=[];
  if(L.size>1.04) L.features.push('litt stor'); else if(L.size<.96) L.features.push('liten og nett');
  if(L.eyeSize>1.05) L.features.push('ekstra store øyne');
  if(L.earSize>1.06) L.features.push('store ører');
  if(L.furLen>(dims.furLen||.06)*1.08) L.features.push('ekstra myk pels');
  return L;
}
const BREEDS=[
 {id:'golden',name:'Golden retriever',desc:'Snill og glad, med myk gyllen pels.',sw:['#d9a45c','#eed2a0','#c88a46'],make(r){
   const b=jitter(pick(r,['#d9a45c','#e3b878','#c88a46','#eed2a0']),r);
   return mk(r,{furLen:.085,density:80,earSize:1.05,tailLen:.42,snoutL:.22,headR:.43,legLen:.29,nose:'#2b1d17'},
     {all:b,body:{a:b,b:shade(b,-.07),t:.2},chest:{a:shade(b,.08)},snout:{a:shade(b,.05)},ear:{a:shade(b,-.08)}});}},
 {id:'lab',name:'Labrador',desc:'Verdens mest populære familiehund. Matglad!',sw:['#232020','#e6c98f','#5e3c28'],make(r){
   const v=r(); const b=v<.38?'#232020':v<.78?jitter('#e6c98f',r):jitter('#5e3c28',r);
   const L=mk(r,{furLen:.035,density:150,earSize:.85,tailType:'otter',tailR:.08,tailLen:.4,snoutL:.22,bodyW:.36,nose:v<.38||v>=.78?'#1a1514':'#3b2a22'},{all:b,chest:{a:shade(b,.03)},ear:{a:shade(b,-.04)}});
   L.colorName=v<.38?'svart':v<.78?'gul':'sjokoladebrun'; return L;}},
 {id:'fransk',name:'Fransk bulldog',desc:'Liten klovn med flaggermusører og flat snute.',sw:['#c9a07a','#3a2e27','#f1ece4'],make(r){
   const v=r(); let all,spot=null,sn,fe;
   if(v<.35){all=jitter('#c9a07a',r);sn='#3a2b23';fe='fawn';}
   else if(v<.55){all=jitter('#eadbc2',r);sn=shade(all,-.06);fe='krem';}
   else if(v<.78){all='#3a2e27';spot={col:'#7a5b45',amt:.9,scale:[3,18,3]};sn='#2a211d';fe='tigret';}
   else {all='#f1ece4';spot={col:'#1d1b1b',amt:.7,scale:[2.2,2.2,2.2]};sn='#f1ece4';fe='flekkete';}
   const L=mk(r,{bodyW:.38,bodyH:.3,bodyL:.42,legLen:.21,legR:.1,headR:.47,snoutL:.06,snoutW:.24,snoutH:.16,earType:'up',earRound:1,earSize:1.35,earTilt:.3,tailType:'short',furLen:.022,density:190,spot},

const FUR_VS=`
uniform float uShell,uLen,uWet,uMessy,uCurl,uFace;
uniform vec3 uScale;
uniform mat4 uRootInv;
varying vec3 vN,vWorld,vLocal,vStrand,vObjN;
void main(){
  mat3 nm=transpose(inverse(mat3(modelMatrix)));
  vec3 wn=normalize(nm*normal);
  vec4 base=modelMatrix*vec4(position,1.0);
  vec4 wp=base;
  float len=uLen*(1.0-0.55*uWet)*(1.0-uFace*0.9*smoothstep(-0.05,0.55,normal.z)*smoothstep(-0.9,-0.2,normal.y-0.0)*1.0);
  float s=uShell;
  vec3 strand=position*uScale;
  vec3 mess=vec3(sin(strand.y*23.0+strand.z*17.0),sin(strand.z*19.0+strand.x*29.0),sin(strand.x*21.0+strand.y*13.0));
  vec3 off=wn*len*s;
  off+=vec3(0.0,-1.0,0.0)*len*s*s*(0.35+uWet*0.9);
  off+=mess*len*s*s*uMessy*0.9;
  if(uCurl>0.0){float a=s*9.0+dot(strand,vec3(31.0,17.0,23.0));off+=vec3(cos(a),sin(a*0.7)*0.5,sin(a))*len*0.4*uCurl*s;}
  wp.xyz+=off;
  vWorld=wp.xyz; vN=wn; vStrand=strand; vObjN=normalize(normal);
  vLocal=(uRootInv*base).xyz;
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const FUR_FS=`
uniform float uShell,uDensity,uDirt,uFoam,uWet,uTopOn,uTopT,uLowH,uSpotAmt,uShine;
uniform vec3 uColA,uColB,uLowCol,uSpotCol,uSpotScale,uSpotOff,uSunDir,uSunCol,uSky,uGround;
uniform mat4 uRootInv;
varying vec3 vN,vWorld,vLocal,vStrand,vObjN;
float hash13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yxx)*p3.zyx);}
float vnoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*vnoise(p);p=p*2.03+1.7;a*=0.5;}return v;}
void main(){
  float s=uShell;
  vec3 ci=floor(vStrand*uDensity);
  if(s>0.0){
    vec3 f=fract(vStrand*uDensity)-(hash33(ci)*0.3+0.35);
    f-=dot(f,vObjN)*vObjN;
    float hl=0.45+0.55*hash13(ci+3.7);
    float t=s/hl;
    if(t>1.0) discard;
    if(length(f)>0.5*(1.0-t*t*0.8)) discard;
  }
  vec3 Nl=normalize(mat3(uRootInv)*vN);
  vec3 col=uColA;
  col=mix(col,uColB,uTopOn*smoothstep(uTopT-0.15,uTopT+0.15,Nl.y));
  col=mix(col,uLowCol,1.0-smoothstep(uLowH-0.025,uLowH+0.025,vLocal.y));
  if(uSpotAmt>0.0){float sp=fbm(vLocal*uSpotScale+uSpotOff);col=mix(col,uSpotCol,smoothstep(0.6-uSpotAmt*0.18,0.64-uSpotAmt*0.18,sp));}
  col*=0.86+0.28*hash13(ci+1.3);
  if(uDirt>0.01){
    float dn=fbm(vLocal*4.0+3.1)+(0.45-vLocal.y)*0.25;
    float T=0.78-uDirt*0.42;
    float dm=smoothstep(T,T+0.07,dn);
    col=mix(col,vec3(0.17,0.105,0.05),dm*0.9);
    col=mix(col,col*vec3(0.72,0.66,0.55),uDirt*0.6);
  }
  if(uFoam>0.01){float fm=smoothstep(0.5,0.56,vnoise(vLocal*9.0)*0.6+uFoam*0.45);col=mix(col,vec3(0.93,0.95,0.98),fm);}
  col*=1.0-0.35*uWet;
  float ao=mix(0.3,1.0,pow(s,0.8));
  vec3 N=normalize(vN);vec3 V=normalize(cameraPosition-vWorld);vec3 L=normalize(uSunDir);
  float wrap=clamp((dot(N,L)+0.5)/1.5,0.0,1.0);
  vec3 hem=mix(uGround,uSky,N.y*0.5+0.5);
  vec3 H=normalize(L+V);
  float spec=pow(max(dot(N,H),0.0),24.0)*(0.05+uShine*0.18+uWet*0.4)*s;
  float rim=pow(1.0-max(dot(N,V),0.0),3.0)*0.45*s;
  vec3 lit=col*(hem+uSunCol*wrap)*ao+uSunCol*spec+hem*rim*col;
  gl_FragColor=vec4(lit,1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

        const rim=new THREE.Mesh(new THREE.TorusGeometry(hr*.8,hr*.12,10,40),std(shade(col,-.08)));rim.rotation.x=Math.PI/2;g.add(rim);

  setCare(dirt,wet,foam,groom){
    this.u.uDirt.value=dirt;this.u.uWet.value=wet;this.u.uFoam.value=foam;
    this.u.uMessy.value=lerp(1.1,.05,groom);this.u.uShine.value=groom;

  doAction(name,dur){this.action={name,t:0,dur};}
  moveTo(p,cb,speed=2.2){this.moveTarget=new THREE.Vector3(p.x,0,p.z);this.onArrive=cb;this.speed=speed;}
  get busy(){return !!this.moveTarget||this.mode!=='idle';}
  update(dt,cam){
    this.time+=dt;const t=this.time,k=this.look,p=this.pose,m=this.mood;
    // bevegelse
    let running=false;
    if(this.moveTarget){
      const d=this.moveTarget.clone().sub(this.root.position);d.y=0;const dist=d.length();
      if(dist<.04){this.moveTarget=null;const cb=this.onArrive;this.onArrive=null;cb&&cb();}
      else{running=true;const yaw=Math.atan2(d.x,d.z);this.root.rotation.y=dampAngle(this.root.rotation.y,yaw,10,dt);
        const step=Math.min(dist,this.speed*dt);
        this.root.position.addScaledVector(d.normalize(),step);}
    }else{this.root.rotation.y=dampAngle(this.root.rotation.y,this.yawTarget,5,dt);}
    // mål for posering
    const T={lower:0,pitch:0,yaw:0,roll:0,tail:0,wag:0,wagSpd:0,ear:0,eye:1,tongue:0,brow:0};
    T.tail=lerp(.95,-.75,m.sad);T.wag=(.06+m.happy*.55)*(1-m.sad*.8);T.wagSpd=6+m.happy*12;
    T.ear=m.sad;T.eye=1-m.sad*.3-m.tired*.45;T.tongue=(m.happy>.65&&m.sad<.2)?1:0;T.brow=m.sad;T.pitch=m.sad*.3+m.tired*.15;
    // se på kamera / mål
    this.tiltT-=dt;if(this.tiltT<0){this.tiltT=2+Math.random()*4;this.tilt=Math.random()<.4?(Math.random()-.5)*.6:0;this.idleLook.set((Math.random()-.5)*.6,(Math.random()-.5)*.2);}
    const lt=this.lookTarget||cam.position;
    const loc=this.root.worldToLocal(lt.clone());
    const hy=this.bodyY+k.bodyH*.55+k.headR*.75,hz=k.bodyL*.7;
    let yaw=Math.atan2(loc.x,loc.z-hz),pit=-Math.atan2(loc.y-hy,Math.hypot(loc.x,loc.z-hz));
    if(Math.abs(yaw)>1.6){yaw=this.idleLook.x;pit=this.idleLook.y;}
    T.yaw=clamp(yaw,-.75,.75)+(this.lookTarget?0:this.idleLook.x*.3);T.pitch+=clamp(pit,-.45,.4);T.roll=this.tilt*(1-m.sad);
    switch(this.mode){
      case 'eat':T.pitch=.85+Math.sin(t*14)*.07;T.yaw=0;T.roll=0;T.tongue=0;T.tail=.9;T.wag=.55;T.wagSpd=14;T.ear=.3;break;
      case 'sleep':T.lower=1;T.pitch=.45;T.yaw=.35;T.roll=.25;T.eye=0;T.tail=-1;T.wag=0;T.ear=.7;T.tongue=0;T.brow=0;break;
      case 'show':T.pitch=-.12;T.tail=1;T.wag=.5;T.wagSpd=12;T.tongue=1;T.ear=0;T.eye=1;break;
    }
    if(running){T.yaw=0;T.pitch=-.1;T.tail=.7;T.wag=.4;T.wagSpd=14;T.roll=0;}
    if(this.action){this.action.t+=dt;if(this.action.t>this.action.dur)this.action=null;}
    const A=this.action;
    if(A&&A.name==='tilt'){T.roll=.45*Math.sin(Math.min(1,A.t/A.dur)*Math.PI);T.wag=.8;T.wagSpd=18;T.eye=.35;T.tongue=1;}
    if(A&&A.name==='nope'){T.yaw=Math.sin(A.t*18)*.5;T.pitch=.1;}
    for(const key in T)p[key]=damp(p[key],T[key],key==='yaw'||key==='pitch'?6:4,dt);
    // anvend
    const legH=k.legLen;
    let bob=0,jump=0,shake=0;
    if(running){this.legPhase+=dt*this.speed*7;bob=Math.abs(Math.sin(this.legPhase))*.05;}
    if(A&&A.name==='jump'){jump=Math.max(0,Math.sin(A.t*Math.PI*2.6))*.28*(1-A.t/A.dur);}
    if(A&&A.name==='shake'){shake=Math.sin(A.t*42)*.4*Math.sin(Math.min(1,A.t/A.dur)*Math.PI);}
    const breath=Math.sin(t*(this.mode==='sleep'?2.2:4.5))*.012;
    this.bodyG.position.y=this.bodyY-p.lower*legH*.8+bob+jump;
    this.bodyG.rotation.z=shake*.6;
    this.bodyG.rotation.x=p.lower*.05;
    this.bodyG.scale.set(1+breath*.5,1+breath,1);
    for(const lg of this.legs){
      const ud=lg.userData;let rx=-p.lower*1.35;
      if(running)rx+=Math.sin(this.legPhase+(ud.front?0:Math.PI)+(ud.x>0?.6:0))*.75;
      if(A&&A.name==='scratch'&&!ud.front&&ud.x>0)rx=-1.1+Math.sin(A.t*40)*.35;
      if(A&&A.name==='jump')rx+=-.4*jump/.28*(ud.front?1:-1);
      lg.rotation.x=rx;lg.rotation.z=p.lower*ud.x*.15;
    }
    this.headG.rotation.x=p.pitch+(A&&A.name==='scratch'?.2:0);
    this.headG.rotation.y=p.yaw;
    this.headG.rotation.z=p.roll+shake*.8;
    this.tailG.rotation.x=-(Math.PI/2-(k.tailType==='curl'?Math.max(p.tail,-.2)*1.1+.35:p.tail*.9));
    this.tailWag.rotation.y=Math.sin(t*p.wagSpd)*p.wag;
    for(const e of this.ears){const sd=e.userData.sd;
      if(k.earType==='up'){e.rotation.z=-sd*(k.earTilt+p.ear*.35)+Math.sin(t*3+sd)*.02;e.rotation.x=-p.ear*.85+(k.earFlip&&sd>0?1.3:0);}
      else if(k.earType==='semi'){e.rotation.z=sd*(1.0-p.ear*.6);e.rotation.x=-.2;}
      else {e.rotation.z=sd*(.18+p.ear*.15)+(running?Math.sin(this.legPhase*2)*.25*sd:0)+shake*sd;e.rotation.x=running?-.4:0;}
    }
    // blunk
    this.blinkT-=dt;if(this.blinkT<0){this.blink=0;if(this.blinkT<-.12){this.blinkT=1.5+Math.random()*4;}}else this.blink=1;
    const eo=Math.max(.06,p.eye*(this.blinkT<0?.05:1));
    for(const e of this.eyes)e.scale.y=eo;
    for(const b of this.brows)b.rotation.z=b.userData.sd*(-.15+p.brow*.55);
    this.tongue.scale.set(1,p.tongue,1);this.tongue.visible=p.tongue>.05;
    this.root.updateMatrixWorld(true);
    this.u.uRootInv.value.copy(this.root.matrixWorld).invert();
  }
  worldHead(v=new THREE.Vector3()){return this.skull.getWorldPosition(v);}
  worldBody(v=new THREE.Vector3()){return this.bodyG.getWorldPosition(v);}
  dispose(){

const particles=[];
function spawn(tex,pos,o={}){
  const m=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:0});
  const s=new THREE.Sprite(m);s.position.copy(pos);const size=o.size||.2;s.scale.setScalar(size);scene.add(s);
  particles.push({s,v:o.vel?o.vel.clone():new THREE.Vector3(),life:o.life||1.5,age:0,grav:o.grav??0,size,grow:o.grow??0,drag:o.drag??0,wob:o.wob||0,ph:Math.random()*7,maxO:o.opacity??1,floor:o.floor});
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;
    if(p.age>p.life||(p.floor&&p.s.position.y<.01)){scene.remove(p.s);p.s.material.dispose();particles.splice(i,1);continue;}
    p.v.y-=p.grav*dt;p.v.multiplyScalar(1-p.drag*dt);p.s.position.addScaledVector(p.v,dt);
    if(p.wob)p.s.position.x+=Math.sin(p.age*5+p.ph)*p.wob*dt;
    p.s.scale.setScalar(p.size*(1+p.grow*p.age));
    const a=p.age/p.life;p.s.material.opacity=p.maxO*Math.min(1,p.age*8)*(1-a*a);}
}

function makeFly(){const g=new THREE.Group();const b=new THREE.Mesh(SPHERE_LO,flyBodyM);b.scale.set(.024,.021,.038);g.add(b);
  const w1=new THREE.Mesh(wingG,flyWingM),w2=new THREE.Mesh(wingG,flyWingM);w1.position.x=.035;w2.position.x=-.035;g.add(w1,w2);
  g.userData={w1,w2,a:Math.random()*7,sp:2+Math.random()*2,r:.5+Math.random()*.4,h:Math.random()*7,land:0,landPos:new THREE.Vector3(),cool:2+Math.random()*4};scene.add(g);return g;}
function updateFlies(dt,count,pup){
  while(flies.length<count)flies.push(makeFly());
  while(flies.length>count){const f=flies.pop();scene.remove(f);}
  if(!pup)return;
  const c=pup.worldBody(new THREE.Vector3());const sz=pup.look.size;
  for(const f of flies){const u=f.userData;
    u.w1.rotation.y=Math.sin(performance.now()*.08)*.9;u.w2.rotation.y=-u.w1.rotation.y;
    if(u.land>0){u.land-=dt;f.position.lerp(u.landPos.clone().add(c),.2);u.w1.rotation.y=u.w2.rotation.y=.3;if(u.land<=0)u.cool=2+Math.random()*4;continue;}
    u.cool-=dt;
    if(u.cool<0&&Math.random()<.01){const d=new THREE.Vector3(Math.random()-.5,Math.random()*.8,Math.random()-.5).normalize();
      u.landPos.set(d.x*pup.look.bodyW*sz*1.15,d.y*pup.look.bodyH*sz*1.2,d.z*pup.look.bodyL*sz*1.1);u.land=1+Math.random()*2;continue;}
    u.a+=u.sp*dt;u.h+=dt*1.7;
    const tgt=new THREE.Vector3(c.x+Math.cos(u.a)*u.r*sz,c.y+.25+Math.sin(u.h)*.3,c.z+Math.sin(u.a*1.3)*u.r*sz);
    tgt.x+=(Math.random()-.5)*.05;tgt.y+=(Math.random()-.5)*.05;
    const prev=f.position.clone();f.position.lerp(tgt,.12);f.lookAt(prev.lerp(f.position,2));
  }
}

  throwBall(){

    let tgt;for(let i=0;i<20;i++){tgt=new THREE.Vector3((Math.random()-.5)*6.5,0,-2.6+Math.random()*4.6);if(tgt.distanceTo(p.root.position)>1.6&&tgt.distanceTo(BED_POS)>1.2)break;}
    const T=1.0,g=9.8;
    this.ballV.set((tgt.x-start.x)/T,(0.09-start.y+.5*g*T*T)/T,(tgt.z-start.z)/T);
    ball.position.copy(start);ball.visible=true;scene.attach(ball);ball.scale.setScalar(1);this.ballState='flying';this.ballBounce=0;
    p.lookTarget=ball.position;p.mode='play';
  },
  updateBall(dt){
    const p=this.player;if(this.ballState==='none'||!p)return;
    if(this.ballState==='flying'){
      this.ballV.y-=9.8*dt;ball.position.addScaledVector(this.ballV,dt);
      ball.rotation.x+=this.ballV.z*dt*8;ball.rotation.z-=this.ballV.x*dt*8;
      if(ball.position.y<.085){ball.position.y=.085;if(Math.abs(this.ballV.y)>.6){this.ballV.y=-this.ballV.y*.5;this.ballV.x*=.75;this.ballV.z*=.75;this.ballBounce++;}else{this.ballV.y=0;this.ballV.x*=1-2*dt;this.ballV.z*=1-2*dt;}}
      if(Math.abs(ball.position.x)>5){this.ballV.x*=-.6;ball.position.x=Math.sign(ball.position.x)*5;}
      if(ball.position.z<-3.3){this.ballV.z*=-.6;ball.position.z=-3.3;}
      if(ball.position.z>3.5){this.ballV.z*=-.6;ball.position.z=3.5;}
      if(this.ballBounce>0){
        const d=ball.position.clone().sub(p.root.position);d.y=0;const dist=d.length();
        const reach=p.reach;
        if(dist<reach+.08){this.ballState='carried';p.mouthAnchor.add(ball);ball.position.set(0,0,0);ball.scale.setScalar(1/p.look.size);
          p.lookTarget=null;p.moveTo(HOME,()=>this.ballReturned(),2.2);}
        else{const tg=ball.position.clone().addScaledVector(d.normalize(),-reach*.9);p.moveTo(tg,null,2.6);}
      }
    }
  },
  ballReturned(){

  /* ---------- stats ---------- */
  derived(){

    return{well};
  },
  tick(dt){
    const p=this.player,S=this.state.stats,st=this.state;if(!p||!S)return;
    const tr=traitOf(p.gene),lm=1+.22*(st.level-1),sl=p.mode==='sleep';
    const active=this.mode==='home'||this.mode==='wash'||this.mode==='brush';
    if(active){
      S.food-=.2*lm*(tr.m.food||1)*(sl?.5:1)*dt;
      S.clean-=.13*lm*(tr.m.clean||1)*dt*(this.mode==='wash'?0:1);
      S.happy-=.2*lm*(tr.m.happy||1)*(sl?.3:1)*dt;
      if(sl)S.energy+=3.2*dt;else S.energy-=.11*lm*(tr.m.energy||1)*dt;
      S.groom-=.09*lm*(tr.m.groom||1)*dt*(this.mode==='brush'?0:1);
      if(S.clean<30)S.happy-=.12*dt;
      if(S.food<25)S.happy-=.1*dt;
      if(this.state.plage>0)S.happy-=.1*dt;
      for(const k in S)S[k]=clamp(S[k],0,100);
      if(sl&&S.energy>=100){this.wake();toast(`${p.gene.name} har sovet ferdig og er full av energi! ☀️`,'good');}
      // plage
      let bad=0;if(S.food<15)bad++;if(S.clean<15)bad++;if(S.happy<10)bad++;if(S.energy<4)bad+=.5;
      if(bad>0){if(st.plage===0)toast(`⚠️ ${p.gene.name} plages! Ta vare på valpen før det er for sent.`,'bad');st.plage=Math.min(100,st.plage+2.2*bad*dt);}
      else st.plage=Math.max(0,st.plage-3*dt);
      if(st.plage>=100&&this.mode==='home'&&!p.moveTarget){this.lose();return;}
      // advarsler
      const warn=(key,cond,msg)=>{if(cond&&!this.fx.low[key]){this.fx.low[key]=1;toast(msg,'bad');}if(!cond)this.fx.low[key]=0;};
      warn('food',S.food<25,`${p.gene.name} er sulten! 🍖`);
      warn('clean',S.clean<25,`${p.gene.name} er skitten og begynner å lukte… 🪰`);
      warn('happy',S.happy<25,`${p.gene.name} er lei seg og vil leke 🥺`);
      warn('energy',S.energy<15,`${p.gene.name} er veldig trøtt 💤`);
    }
    st.wet=Math.max(0,(st.wet||0)-dt/25*(this.mode==='wash'?0:1));
    // humør på valpen
    const low=Math.min(S.food,S.clean+10,S.happy);
    p.mood.happy=clamp((S.happy-35)/60,0,1)*clamp(S.food/40,0,1);
    p.mood.sad=clamp((40-low)/40,0,1)*.85+(st.plage>0?.15:0);
    p.mood.tired=clamp((30-S.energy)/30,0,1);
    const dirt=clamp((100-S.clean)/100,0,1);
    p.setCare(clamp((dirt-.12)/.88,0,1),st.wet,this.foam||0,S.groom/100);
    // effekter
    if(this.mode==='home'||this.mode==='brush'){
      this.fx.stink-=dt;
      if(dirt>.55&&this.fx.stink<0){this.fx.stink=1.4-dirt;spawn(stinkTex,p.worldBody().add(new THREE.Vector3((Math.random()-.5)*.5,.35,(Math.random()-.5)*.4)),{vel:new THREE.Vector3(0,.35,0),life:2.2,size:.28,grow:.4,wob:.2,opacity:.8});}
      updateFlies(dt,dirt>.55?Math.round((dirt-.5)*16):0,p);
      this.fx.tear-=dt;
      if(p.mood.sad>.65&&this.fx.tear<0&&p.mode!=='sleep'){this.fx.tear=2.5;for(const e of p.eyes){const w=e.getWorldPosition(new THREE.Vector3());spawn(dropTex,w,{vel:new THREE.Vector3(0,-.15,.1),grav:1.5,life:1.2,size:.05,floor:true});}}
      this.fx.scratch-=dt;
      if(dirt>.6&&this.fx.scratch<0&&!p.busy&&!p.action){this.fx.scratch=5+Math.random()*5;p.doAction('scratch',1.6);}
      if(p.mode==='sleep'&&Math.random()<dt*.8)spawn(emojiTex('💤'),p.worldHead().add(new THREE.Vector3(.1,.25,0)),{vel:new THREE.Vector3(.1,.25,0),life:2.2,size:.18,wob:.2});
    }else updateFlies(dt,0,null);
    // spising
    if(p.mode==='eat'){
      this.eatT+=dt;bowl.scale.setScalar(Math.min(1,bowl.scale.x+dt*5));
      S.food=Math.min(100,S.food+11*dt);
      bowl.userData.kib.count=Math.max(0,Math.round(40*(1-this.eatT/3.4)));
      if(this.eatT>3.4){p.mode='idle';S.happy=Math.min(100,S.happy+5);S.clean=Math.max(0,S.clean-2);p.doAction('jump',1);setTimeout(()=>bowl.visible=false,900);toast(`Nam nam! ${p.gene.name} er god og mett 😋`,'good');}
    }
  },

    if(mn<35&&this.mode==='home'&&p.mode!=='sleep'&&!p.moveTarget){need=mn===S.food?'🍖':mn===S.clean?'🛁':mn===S.happy?'🎾':'💤';}
    const bub=$('bubble');
    if(need){const pr=project(p.worldHead().add(new THREE.Vector3(.25,.45,0)));bub.style.left=pr.x+'px';bub.style.top=pr.y+'px';bub.textContent=need;bub.classList.remove('hidden');}
    else bub.classList.add('hidden');
    // knapper
    const busy=p.busy||this.ballState!=='none';
    document.querySelectorAll('.act').forEach(b=>{const a=b.dataset.a;b.disabled=busy&&!['pet','clothes'].includes(a)&&!(a==='sleep'&&p.mode==='sleep');});
    if(this.mode==='wash'||this.mode==='brush'){const v=this.mode==='wash'?S.clean:S.groom;$('toolBar').style.width=v+'%';$('toolBar').style.background=barCol(v);}
    this.syncSleepBtn();
  },
  /* ---------- tap ---------- */
  lose(){
    const p=this.player,S=this.state.stats,g=p.gene,n=g.name;
    const reasons=[];
    if(S.food<15)reasons.push(`${n} fikk ikke nok mat og ble sulten og svak.`);
    if(S.clean<15)reasons.push(`${n} ble så skitten at pelsen luktet vondt, og fluene plaget ${n} hele tiden. Det klødde og gjorde vondt i huden.`);
    if(S.happy<10)reasons.push(`${n} var ensom og lei seg fordi ingen lekte eller koste nok.`);
    if(S.energy<4)reasons.push(`${n} fikk ikke sove nok og ble helt utslitt.`);
    const old=this.state.level;this.state.level=Math.max(1,old-1);
    this.state.lost.push({name:n,breed:g.breed,at:Date.now()});
    this.mode='lost';this.setHud();updateFlies(0,0,null);
    p.lookTarget=null;
    openModal(`<h2>💔 ${n} hadde det ikke godt</h2>
      <p>${reasons.join(' ')||`${n} hadde det vondt for lenge.`}</p>
      <p>En dyrevernsinspektør har hentet ${n} og funnet en ny familie som kan passe godt på valpen. ${n} skal få det bra nå. 🏡</p>
      <p><b>Du går ned ${old>1?`til nivå ${this.state.level}`:'– du er fortsatt på nivå 1'}.</b></p>
      <p style="color:var(--soft)">Tips: Hold øye med 📊-panelet. Valper trenger mat, vask, lek, kos og søvn hver dag.</p>
      <div class="row"><button class="btn" id="again">Velg en ny valp 🐶</button></div>`);
    $('again').onclick=()=>{closeModal();p.dispose();this.player=null;this.state.puppy=null;this.state.stats=null;this.save();this.updateTop();this.showIntro();};
    this.save();
  },
  /* ---------- utstilling ---------- */
  outfitScore(o){
    const ids=Object.keys(o),n=ids.length;if(!n)return 40;
    let s=[0,70,90,100,85,70,60,55,50][n]??50;
    const cols=new Set(ids.filter(i=>i!=='crown').map(i=>o[i]));if(n>=2&&cols.size<=2)s+=10;if(o.crown)s+=8;
    return Math.min(100,s);
  },
  async startShow(){
    const st=this.state,S=st.stats,p=this.player;
    if(Date.now()-(st.lastShow||0)<40000){toast(`${p.gene.name} må hvile litt før neste utstilling (${Math.ceil((40000-(Date.now()-st.lastShow))/1000)} s).`);return;}
    if(S.energy<20){toast(`${p.gene.name} er for trøtt til å stille ut. 💤`);return;}
    st.lastShow=Date.now();
    this.mode='show';this.setHud();updateFlies(0,0,null);bowl.visible=false;
    room.visible=false;stage.visible=true;scene.background=new THREE.Color('#1c1030');hemi.intensity=.35;sun.intensity=.6;
    // motstandere
    const lvl=st.level;const opp=[];
    for(let i=0;i<2;i++){const g=newGene(pick(Math.random,BREEDS).id);const q=new Puppy(g);
      const items=CLOTHES.filter(c=>c.lvl<=Math.max(lvl,2));const nItems=clamp(Math.round(lvl/3+Math.random()*1.5),0,3);const o={};const col=pick(Math.random,COLORS);
      for(let j=0;j<nItems;j++){const c=pick(Math.random,items);if(Object.keys(o).some(id=>CLOTHES.find(x=>x.id===id).slot===c.slot))continue;o[c.id]=Math.random()<.6?col:pick(Math.random,COLORS);}
      q.setOutfit(o);q.mood={happy:.9,sad:0,tired:0};q.setCare(0,0,0,.6+lvl*.04);scene.add(q.root);opp.push(q);}
    this.opponents=opp;
    const order=[opp[0],p,opp[1]];
    order.forEach((q,i)=>{q.root.position.copy(PODIUM[i]);q.root.rotation.y=0;q.yawTarget=0;q.moveTarget=null;q.mode='show';q.lookTarget=null;});
    p.mode='show';
    flyCam([0,1.9,6.2],[0,.85,0],.01);
    spots.forEach(s=>s.intensity=0);
    // poeng
    const o=st.outfit||{};const tr=traitOf(p.gene);
    const fac={clean:S.clean,happy:S.happy,food:S.food,groom:S.groom,outfit:this.outfitScore(o)*(tr.m.outfit||1)};
    const quality=(.27*fac.clean+.22*fac.happy+.13*fac.food+.2*fac.groom+.18*Math.min(100,fac.outfit))/100;
    const wetPen=(st.wet||0)*1.5;
    const judges=['Astrid','Kåre','Lise'];
    const mine=judges.map(()=>clamp(quality*10+(Math.random()-.5)*.8-wetPen,1,10));
    const oppMean=Math.min(9.6,4.6+.5*lvl);
    const scores=order.map(q=>q===p?mine:(()=>{const b=clamp(oppMean+(Math.random()-.5)*1.2,1,9.9);return judges.map(()=>clamp(b+(Math.random()-.5)*.8,1,10));})());
    const r1=s=>Math.round(s*10)/10;
    $('showUI').classList.remove('hidden');$('showResult').classList.add('hidden');
    $('showTitle').innerHTML=`<div class="pill" style="color:var(--ink);text-shadow:none">Nivå ${lvl} – ${LEVELS[lvl]} · Dommere: ${judges.join(', ')}</div>`;
    $('showCards').innerHTML=order.map((q,i)=>`<div class="scard ${q===p?'me':''}" id="sc${i}"><b>${q.gene.name}${q===p?' (din)':''}</b><small>${BREED_MAP[q.gene.breed].name}</small>
      <div class="judges">${judges.map((_,j)=>`<i id="j${i}_${j}">–</i>`).join('')}</div><div class="total"><span id="tot${i}">0</span><span class="medal" id="med${i}"></span></div></div>`).join('');
    await sleep(700);
    for(let i=0;i<3;i++){
      spots.forEach((s,j)=>s.intensity=j===i?120:15);$('sc'+i).classList.add('active');order[i].doAction('jump',1.1);
      let tot=0;
      for(let j=0;j<3;j++){await sleep(650);const v=r1(scores[i][j]);tot+=v;const el=$(`j${i}_${j}`);el.textContent=v.toFixed(1);el.classList.add('in');$('tot'+i).textContent=r1(tot).toFixed(1);}
      await sleep(500);$('sc'+i).classList.remove('active');
    }
    spots.forEach(s=>s.intensity=60);
    const totals=scores.map(s=>s.reduce((a,b)=>a+r1(b),0));
    const rank=[0,1,2].sort((a,b)=>totals[b]-totals[a]);
    rank.forEach((idx,place)=>$('med'+idx).textContent=['🥇','🥈','🥉'][place]);
    const myPlace=rank.indexOf(1);
    st.shows++;
    // kommentarer
    const com=[];
    const fl=[['clean',`«${p.gene.name} kunne vært renere – jeg ser litt skitt i pelsen.»`],['groom',`«Pelsen trenger mer børsting.»`],['happy',`«Valpen virker litt lei seg i dag.»`],['food',`«${p.gene.name} ser litt sulten ut.»`],['outfit',`«Antrekket kunne vært mer gjennomført.»`]];
    const sorted=fl.sort((a,b)=>fac[a[0]]-fac[b[0]]);
    if(fac[sorted[0][0]]<80)com.push(`<b>${judges[0]}:</b> ${sorted[0][1]}`);
    if(fac[sorted[1][0]]<70)com.push(`<b>${judges[1]}:</b> ${sorted[1][1]}`);
    if(wetPen>.2)com.push(`<b>${judges[2]}:</b> «Valpen er fortsatt våt etter badet!»`);
    if(fac.outfit>=95)com.push(`<b>${judges[2]}:</b> «For et flott antrekk!»`);
    if(fac.clean>90&&fac.groom>85)com.push(`<b>${judges[1]}:</b> «Nydelig, skinnende pels!»`);
    if(!com.length)com.push(`<b>${judges[0]}:</b> «En svært velstelt og glad valp!»`);
    await sleep(500);
    let title,txt;
    if(myPlace===0){
      const old=st.level;st.level=Math.min(10,st.level+1);st.best=Math.max(st.best||1,st.level);st.wins++;
      title=`🥇 ${p.gene.name} vant!`;
      const unl=CLOTHES.filter(c=>c.lvl===st.level).map(c=>c.emoji+' '+c.name);
      txt=old<10?`Du går opp til <b>nivå ${st.level} – ${LEVELS[st.level]}</b>! ${unl.length?`<br>Nytt i garderoben: ${unl.join(', ')}`:''}<br><small>Valpene trenger nå litt oftere stell.</small>`:`Du er allerede Champion – fantastisk! 👑`;
      burstConfetti(new THREE.Vector3(0,0,0));p.doAction('jump',2);
      S.happy=Math.min(100,S.happy+15);
    }else{
      title=myPlace===1?`🥈 Andreplass til ${p.gene.name}!`:`🥉 Tredjeplass til ${p.gene.name}`;
      txt=`Du må vinne for å gå opp i nivå. Gjør valpen enda finere og prøv igjen!`;
    }
    S.energy=Math.max(0,S.energy-15);
    this.updateTop();this.save();
    $('showResult').innerHTML=`<h2>${title}</h2><p>${txt}</p><div class="comments">${com.join('<br>')}</div><button class="btn" id="showBack">Tilbake hjem 🏡</button>`;
    $('showResult').classList.remove('hidden');
    $('showBack').onclick=()=>this.endShow();
  },
  endShow(){
    for(const q of this.opponents)q.dispose();this.opponents=[];
    const p=this.player;p.mode='idle';p.root.position.copy(HOME);p.yawTarget=0;
    stage.visible=false;room.visible=true;scene.background=new THREE.Color('#f3dccb');hemi.intensity=.9;sun.intensity=2.4;
    $('showUI').classList.add('hidden');
    this.mode='home';this.setHud();$('stats').classList.toggle('hidden',innerWidth<640);
    flyCam([0,1.5,4.3],[0,.6,0],.01);
  },
  /* ---------- per frame ---------- */
  frame(dt){
    this.tick(dt);this.updateBall(dt);
    if(this.player)this.player.update(dt,camera);
    for(const q of this.litter)q.update(dt,camera);
    for(const q of this.opponents)q.update(dt,camera);
    if(this.mode==='litter'){this.litter.forEach((q,i)=>{const el=$('ll'+i);if(!el)return;const pr=project(q.root.position.clone().add(new THREE.Vector3(0,-.05,.5)));el.style.left=pr.x+'px';el.style.top=pr.y+'px';});}
    if(tub.visible)tub.userData.duck.position.y=.4+Math.sin(performance.now()*.003)*.015;
    if(this.mode==='home'&&this.player&&!camTween){const pp=this.player.root.position;controls.target.x=damp(controls.target.x,pp.x*.5,2,dt);controls.target.z=damp(controls.target.z,pp.z*.5,2,dt);}
  }
};
window.G=G;

/* =========================================================
   Løkke
   ========================================================= */
const clock=new THREE.Clock();let uiT=0,first=true;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.1);
  G.frame(dt);updateParticles(dt);updateConfetti(dt);updateCam(dt);controls.update();
  uiT-=dt;if(uiT<0){uiT=.2;G.updateUI();}
  else if(G.player&&!$('bubble').classList.contains('hidden')){const pr=project(G.player.worldHead().add(new THREE.Vector3(.25,.45,0)));$('bubble').style.left=pr.x+'px';$('bubble').style.top=pr.y+'px';}
  renderer.render(scene,camera);
  if(first){first=false;$('loading').classList.add('hidden');}
}
G.init();
loop();
</script>
</body>
